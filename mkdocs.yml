# MkDocs Material configuration — go-parts
# https://squidfunk.github.io/mkdocs-material/

site_name: go-parts
site_description: A single-binary, embedded-storage electronics parts database.
site_author: Stephen Eaton
site_url: https://madeinoz67.github.io/go-parts/

repo_name: madeinoz67/go-parts
repo_url: https://github.com/madeinoz67/go-parts

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Architecture:
    - Overview: architecture/overview.md
  - Reference:
    - PRD (v3.7): internals/go-parts-prd.md

plugins:
  - search
  - offline

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/madeinoz67/go-parts
