{{define "locations.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>go-parts · storage</title>
  <link rel="stylesheet" href="/ui/static/css/styles.css">
  <script src="/ui/static/js/htmx.min.js"></script>
</head>
<body>
<div class="shell">
  <header class="header">
    <span class="wordmark">&gt; go<span class="dash">-</span>parts<span class="cursor"></span></span>
  </header>

  <nav class="topnav">
    <a class="nav-item" href="/ui/">Parts</a>
    <a class="nav-item active">Storage</a>
    <a class="nav-item disabled" title="later slice">Projects</a>
    <a class="nav-item disabled" title="later slice">Purchasing</a>
    <a class="nav-item disabled" title="later slice">Builds</a>
    <a class="nav-item disabled" title="later slice">Reports</a>
  </nav>

  <div class="body-grid">
    <main class="main">
      {{if .Error}}<div class="conflict"><p>{{.Error}}</p></div>{{end}}

      <form class="create" action="/ui/locations" method="post" style="margin-bottom:12px;flex-direction:row;flex-wrap:wrap;gap:6px">
        <input name="label" placeholder="label (e.g. Bin A3)" required style="flex:1;min-width:12em">
        <select name="parent_id">
          <option value="">(top-level)</option>
          {{range .Locations}}<option value="{{.ID}}">{{.Label}}</option>{{end}}
        </select>
        <label style="display:flex;align-items:center;gap:4px"><input type="checkbox" name="single_part_only" value="true"> single</label>
        <input name="notes" placeholder="notes" style="flex:1;min-width:10em">
        <button class="btn btn-primary" type="submit">add</button>
      </form>

      <table class="parts">
        <thead>
          <tr>
            <th role="columnheader"><a hx-get="/ui/locations/search?sort=label&dir=asc" hx-target="#loc-tbody" hx-select="#loc-tbody" hx-swap="outerHTML">Label <span class="sort-ind">↕</span></a></th>
            <th role="columnheader"><a hx-get="/ui/locations/search?sort=via&dir=asc" hx-target="#loc-tbody" hx-select="#loc-tbody" hx-swap="outerHTML">Via <span class="sort-ind">↕</span></a></th>
            <th>Parent</th>
            <th role="columnheader"><a hx-get="/ui/locations/search?sort=contents&dir=desc" hx-target="#loc-tbody" hx-select="#loc-tbody" hx-swap="outerHTML">Contents <span class="sort-ind">↕</span></a></th>
            <th>Single</th>
          </tr>
        </thead>
        <tbody id="loc-tbody">
          <tr hx-get="/ui/locations/search" hx-trigger="load" hx-target="#loc-tbody" hx-select="#loc-tbody" hx-swap="outerHTML"></tr>
        </tbody>
      </table>
    </main>

    <section class="detail" id="loc-detail">
      <p class="hint">select a location</p>
    </section>
  </div>

  <footer class="statusbar">
    <span class="seg mode">-- STORAGE --</span>
    <span class="sep">|</span>
    <span class="seg rec"><span class="num">{{len .Locations}} locations</span></span>
    <span class="seg ver" style="margin-left:auto">v2.1 · dev</span>
  </footer>
</div>
<script>
// Slice 6: a via-scan redirect lands on /ui/locations?loc={id}; auto-open it.
(function(){ const l = new URLSearchParams(location.search).get('loc'); if (l) htmx.ajax('GET', '/ui/locations/'+l, {target:'#loc-detail'}); })();
</script>
</body>
</html>
{{end}}
