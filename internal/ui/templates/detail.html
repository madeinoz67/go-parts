{{define "detail.html"}}
<div class="panel-icon">{{template "status-badge.html" (dict "P" .P)}}</div>
<h2 class="panel-title">{{.P.MPN}}</h2>
<div class="part-sub">{{.P.Manufacturer}}{{if .P.Tags}} · {{index .P.Tags 0}}{{end}}{{if .P.Footprint}} · {{.P.Footprint}}{{end}}</div>

<div class="spec-rows">
  {{range $k, $v := .P.Specs}}
  <div class="spec-row"><span>{{$k}}</span><span class="phos">{{$v}}</span></div>
  {{end}}
  <div class="spec-row">
    <span>On hand</span>
    <form class="qty-stepper" hx-post="/ui/parts/{{.P.ID}}/stock" hx-target="#detail-panel" hx-swap="innerHTML">
      <button type="button" class="step" onclick="var i=this.form.querySelector('input[name=delta]'); i.value=-1; this.form.requestSubmit()" aria-label="decrease">−</button>
      <span class="qty-value">{{.P.QtyOnHand}}</span>
      <input type="hidden" name="delta" value="0">
      <button type="button" class="step" onclick="var i=this.form.querySelector('input[name=delta]'); i.value=1; this.form.requestSubmit()" aria-label="increase">+</button>
    </form>
  </div>
</div>

<hr>

<form class="inline edit" hx-post="/ui/parts/{{.P.ID}}" hx-target="#detail-panel">
  <input type="hidden" name="version" value="{{.P.Version}}">
  <input type="text" name="description" value="{{.P.Description}}" placeholder="description" style="flex:1;min-width:12em">
  <input type="text" name="footprint" value="{{.P.Footprint}}" list="footprints-list" placeholder="footprint" style="width:8em">
  <datalist id="footprints-list">{{range .Footprints}}<option value="{{.}}">{{end}}</datalist>
  <button class="btn btn-primary" type="submit">save</button>
</form>
{{end}}
