{{define "locations-rows.html"}}
<tbody id="loc-tbody">
{{if not .Locations}}
  <tr class="empty"><td colspan="3" style="text-align:center;color:var(--text-faint);padding:18px">no locations yet — click + new</td></tr>
{{else}}
{{range .Locations}}
<tr hx-get="/ui/locations/{{.ID}}" hx-target="#loc-detail" hx-swap="innerHTML">
  <td>{{.Label}}</td>
  <td class="phos">{{.ViaCode}}</td>
  <td class="num">{{index $.Counts .ID}}</td>
</tr>
{{end}}
{{end}}
</tbody>
<aside class="sidebar" id="loc-tag-nav" hx-swap-oob="true">{{template "loc-tag-nav.html" (dict "Tags" .Tags "Active" .Active)}}</aside>
{{end}}
