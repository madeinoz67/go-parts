{{define "rows.html"}}
<tbody id="parts-tbody">
{{if not .Parts}}
  <tr class="empty"><td colspan="5">no matches for "{{.Q}}"</td></tr>
{{else}}
{{range .Parts}}{{template "row.html" (dict "P" .)}}{{end}}
{{end}}
</tbody>
{{if .Tags}}<aside class="sidebar" id="tag-nav" hx-swap-oob="true">{{template "tag-nav.html" (dict "Tags" .Tags "Active" .Active)}}</aside>{{end}}
{{end}}
