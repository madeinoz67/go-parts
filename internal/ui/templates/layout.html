<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>go-parts</title>
  <link rel="stylesheet" href="/ui/static/css/styles.css">
  <script src="/ui/static/js/htmx.min.js"></script>
</head>
<body>
<div class="shell">
  <header class="header">
    <span class="wordmark">&gt; go<span class="dash">-</span>parts<span class="cursor"></span></span>
    <div class="search">
      <span class="search-icon">&gt;</span>
      <input id="search" class="search-input" type="text" name="q" placeholder="search mpn, description, footprint…"
             hx-get="/ui/parts/search" hx-trigger="keyup changed delay:0ms"
             hx-target="#parts-tbody" hx-select="#parts-tbody" hx-swap="outerHTML"
             hx-include="this" autocomplete="off">
      <span class="search-kbd">/</span>
    </div>
    <button class="btn btn-primary nav-action" hx-get="/ui/parts/new" hx-target="#detail-panel" hx-swap="innerHTML">+ new</button>
  </header>

  <nav class="topnav">
    <a class="nav-item active">Parts</a>
    <a class="nav-item" href="/ui/locations">Storage</a>
    <a class="nav-item disabled" title="later slice">Projects</a>
    <a class="nav-item disabled" title="later slice">Purchasing</a>
    <a class="nav-item disabled" title="later slice">Builds</a>
    <a class="nav-item disabled" title="later slice">Reports</a>
  </nav>

  <div class="body-grid">
    <aside class="sidebar" id="tag-nav">
      {{template "tag-nav.html" (dict "Tags" .Tags "Active" "")}}
    </aside>

    <main class="main">
      {{template "bulk-bar.html" .}}
      <table class="parts">
        <thead>
          <tr>
            <th class="checkbox-col"><input type="checkbox" class="row-checkbox" id="selectAll" aria-label="select all visible" onchange="toggleSelectAll(this)"></th>
            <th role="columnheader"><a hx-get="/ui/parts/search?sort=mpn&dir=asc" hx-target="#parts-tbody" hx-include="#search">MPN <span class="sort-ind">↕</span></a></th>
            <th>Description</th>
            <th role="columnheader"><a hx-get="/ui/parts/search?sort=footprint&dir=asc" hx-target="#parts-tbody" hx-include="#search">Package <span class="sort-ind">↕</span></a></th>
            <th role="columnheader"><a hx-get="/ui/parts/search?sort=qty&dir=asc" hx-target="#parts-tbody" hx-include="#search">Qty <span class="sort-ind">↕</span></a></th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="parts-tbody">
          <tr hx-get="/ui/parts/search" hx-trigger="load" hx-target="#parts-tbody" hx-select="#parts-tbody" hx-swap="outerHTML"></tr>
        </tbody>
      </table>
    </main>

    <section class="detail" id="detail-panel">
      <p class="hint">select a part</p>
    </section>
  </div>

  <footer class="statusbar">
    <span class="seg mode">-- NORMAL --</span>
    <span class="sep">|</span>
    <span class="seg rec"><span class="num">{{.Count}} parts indexed</span></span>
    <span class="sep">|</span>
    <span class="seg dots"><!-- Phase 1: no gateways — dots stay absent until Phase 5 --></span>
    <span class="seg ver" style="margin-left:auto">v2.1 · {{.Version}}</span>
  </footer>
</div>
<script>
// Slice 6: a via-scan redirect lands on /ui/?part={id}; auto-open the detail.
(function(){ const p = new URLSearchParams(location.search).get('part'); if (p) htmx.ajax('GET', '/ui/parts/'+p, {target:'#detail-panel'}); })();
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.id !== 'search') { e.preventDefault(); document.getElementById('search').focus(); }
  if (e.key === 'Escape') {
    document.getElementById('confirmOverlay')?.classList.remove('active');
    const dp = document.getElementById('detail-panel');
    if (dp) dp.innerHTML = '<p class="hint">select a part</p>';
  }
  if (e.key === 'n' && document.activeElement.id !== 'search' && !/input|select|textarea/i.test(document.activeElement.tagName)) {
    document.getElementById('search')?.blur();
    const newBtn = document.querySelector('[hx-get="/ui/parts/new"]');
    if (newBtn) htmx.trigger(newBtn, 'click');
  }
});

function updateBulkBar(){
  const checked = document.querySelectorAll('tbody tr .row-checkbox[name=id]:checked');
  // §7.2: selection persists across a re-sort (same rows reordered) and clears
  // on a new search (different row set). Sync selectedIds FROM the DOM on every
  // call — normal checkbox clicks update it live, and afterSwap re-syncs after
  // re-applying (sort) or clearing (new search).
  selectedIds = new Set([...checked].map(cb => cb.value));
  const bar = document.getElementById('bulkBar');
  const chips = document.getElementById('chipsRow');
  if (checked.length > 0) {
    chips.style.display = 'none'; bar.classList.add('active');
    document.getElementById('bulkCount').textContent = checked.length + ' selected';
  } else {
    chips.style.display = 'flex'; bar.classList.remove('active');
  }
  const all = document.querySelectorAll('tbody tr .row-checkbox[name=id]');
  document.getElementById('selectAll').checked = all.length > 0 && checked.length === all.length;
}
function toggleSelectAll(src){
  document.querySelectorAll('tbody tr:not([style*="display: none"]) .row-checkbox[name=id]').forEach(cb => cb.checked = src.checked);
  updateBulkBar();
}
function clearSelection(){
  document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = false);
  updateBulkBar();
}
let lastChecked = null;
document.addEventListener('click', e => {
  const cb = e.target.closest('tbody tr .row-checkbox[name=id]');
  if (!cb) return;
  if (e.shiftKey && lastChecked) {
    const boxes = [...document.querySelectorAll('tbody tr .row-checkbox[name=id]')];
    const i = boxes.indexOf(cb), j = boxes.indexOf(lastChecked);
    boxes.slice(Math.min(i,j), Math.max(i,j)+1).forEach(b => b.checked = true);
  }
  lastChecked = cb;
  updateBulkBar();
});
let lastTrigger = null;
function askDelete(){
  const n = document.querySelectorAll('tbody tr .row-checkbox[name=id]:checked').length;
  document.getElementById('confirmCount').textContent = n;
  lastTrigger = document.activeElement;
  document.getElementById('confirmOverlay').classList.add('active');
  document.querySelector('#confirmOverlay .btn')?.focus();
}
function hideConfirm(){
  document.getElementById('confirmOverlay').classList.remove('active');
  if (lastTrigger) { lastTrigger.focus(); lastTrigger = null; }
}
// htmx swaps the tbody on search/sort; re-sync the bar + selection afterwards.
// §7.2: a re-sort (unchanged query) preserves selection; a new search (changed
// query) clears it. selectedIds is module-level so it survives the swap.
let selectedIds = new Set();
let lastQuery = "";
// §7.2 filter-preservation: track the live view state so the bulk-action
// configRequest handler below can inject it into the POST body. q is read
// live from #search at submit time; sort/dir/tag/low are tracked here.
let viewSort = '', viewDir = '', viewTag = '', viewLow = '';
document.body.addEventListener('htmx:afterSwap', e => {
  if (e.target.id !== 'parts-tbody') return;
  lastChecked = null;
  const q = document.getElementById('search').value;
  if (q === lastQuery) {
    // Same query → it was a sort/re-fetch of the same row set. Re-apply the
    // persisted selection to the freshly-rendered (unchecked) rows, then sync.
    document.querySelectorAll('tbody tr .row-checkbox[name=id]').forEach(cb => {
      if (selectedIds.has(cb.value)) cb.checked = true;
    });
  } else {
    // New query → different row set. Clear selection explicitly.
    selectedIds.clear();
    lastQuery = q;
  }
  updateBulkBar();
});

// §7.2 filter-preservation: bulk delete/tag from a filtered view must re-render
// THAT view, not reset to all-parts. The bulk-bar's hidden q/tag/low/sort/dir
// fields render EMPTY in this shell (layout.html inline) and #toolbar is no
// longer OOB-swapped (removed in 720daba — the OOB mechanism mangled <form>s
// in table context), so the browser must supply the live view state with the
// bulk POST. The Go handlers already read these values from r.PostForm — this
// is the missing client half.
//
// Click delegation on document.body survives the OOB #tag-nav swap that fires
// on every keystroke (direct listeners on tag anchors would die on the first
// search). Sort headers live in the stable <thead>; chips live in the stable
// #toolbar — delegation covers all three uniformly.
document.body.addEventListener('click', e => {
  const a = e.target.closest('a[hx-get]');
  if (!a) return;
  const params = new URL(a.getAttribute('hx-get'), location.href).searchParams;
  // Sort headers: <th><a hx-get="...?sort=mpn&dir=asc">.
  if (params.has('sort')) {
    viewSort = params.get('sort') || '';
    viewDir  = params.get('dir')  || '';
  }
  // Tag sidebar: #tag-nav a[hx-get*="tag="].
  if (a.closest('#tag-nav') && params.has('tag')) {
    viewTag = params.get('tag') || '';
  }
  // Chips inside #toolbar: low-stock sets low=1; the all-parts chip (its
  // hx-get is /ui/parts/search with no params) clears low AND tag — it is
  // the unfiltered root view.
  if (a.closest('#toolbar')) {
    if (params.has('low')) {
      viewLow = params.get('low') || '';
    } else if (a.classList.contains('chip')) {
      viewLow = '';
      viewTag = '';
    }
  }
});

// htmx fires htmx:configRequest before every AJAX request; evt.detail.parameters
// is mutable. For bulk-delete/bulk-tag ONLY, inject the live view state. The
// `if (!p[k])` guard lets an explicit form field override — but the bulk-bar's
// hidden fields render empty in the shell, so the tracked values win.
document.body.addEventListener('htmx:configRequest', e => {
  // Check the triggering element (not pathInfo — htmx 2.x's configRequest
  // doesn't expose pathInfo.requestPath). If the request originates from a
  // bulk form, inject the live view state so the action preserves the filter.
  const elt = e.detail.elt;
  if (!elt || !elt.closest('#bulkDeleteForm, #bulkTagForm, #bulkMoveForm')) return;
  const p = e.detail.parameters;
  if (!p['q'])   p['q']   = (document.getElementById('search') || {}).value || '';
  if (!p['sort']) p['sort'] = viewSort;
  if (!p['dir'])  p['dir']  = viewDir;
  if (!p['tag'])  p['tag']  = viewTag;
  if (!p['low'])  p['low']  = viewLow;
});
</script>
</body>
</html>
