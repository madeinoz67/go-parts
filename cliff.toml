# git-cliff configuration for automated changelog generation
# https://git-cliff.org

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}

    ### {{ group | striptags | trim | upper_first }}

    {% for commit in commits %}
        - {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [
    { pattern = '\n.*', replace = "" },
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/madeinoz67/go-parts/issues/${2}))" },
    { pattern = '(?i)(closes|fixes|resolves)\s+#([0-9]+)', replace = "${1} [#${2}](https://github.com/madeinoz67/go-parts/issues/${2})" },
]
commit_parsers = [
    { message = "(?i)^[a-z]+!:", group = "⚠ BREAKING CHANGES" },
    { footer = "(?i)^BREAKING CHANGE:", group = "⚠ BREAKING CHANGES" },
    { footer = "(?i)^BREAKING-CHANGE:", group = "⚠ BREAKING CHANGES" },
    { message = "(?i)^feat", group = "Added" },
    { message = "(?i)^fix", group = "Fixed" },
    { message = "(?i)^perf", group = "Performance" },
    { body = "(?i).*security", group = "Security" },
    { message = "(?i)^chore", skip = true },
    { message = "(?i)^ci", skip = true },
    { message = "(?i)^docs", skip = true },
    { message = "(?i)^test", skip = true },
    { message = "(?i)^style", skip = true },
    { message = "(?i)^refactor", skip = true },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"

[remote.github]
owner = "madeinoz67"
repo = "go-parts"
